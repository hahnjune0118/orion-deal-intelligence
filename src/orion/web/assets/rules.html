<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orion · Adaptive Due Diligence</title><link rel="stylesheet" href="/assets/rules.css"><link rel="stylesheet" href="/assets/deal_visuals.css"><script defer src="/assets/deal_visuals.js"></script><script defer src="/assets/rules.js"></script></head>
<body class="rules-app"{% if hosted %} data-hosted="true"{% endif %}>
<a href="#r-main" class="r-skip">작업 영역으로 건너뛰기</a>
<header class="r-header"><div class="r-brand"><span>O</span><div><strong>ORION</strong><small>Adaptive Due Diligence</small></div></div>
<div id="r-project-heading">근거에서 다음 질문으로</div><span class="r-mode">규칙 기반 · 외부 AI 사용 없음</span><span id="r-version"></span></header>
<div class="r-shell"><aside class="r-left" aria-label="프로젝트 및 작업 단계">
<label for="r-project">프로젝트</label><select id="r-project"><option value="">프로젝트 선택</option></select>
<details id="r-new-project"><summary>＋ 새 프로젝트</summary><form id="r-create"><label>기업명<input name="company" required maxlength="120" placeholder="검토할 기업명"></label><label>검토 기간<input name="period" required maxlength="120" placeholder="예: 2025년 / 2026년 3분기"></label><label>업종<select name="industry"><option value="general">일반 기업</option><option value="subscription">구독·소프트웨어</option><option value="manufacturing">제조업</option><option value="service">서비스업</option></select></label><button class="r-primary">프로젝트 만들기</button></form></details>
<section id="r-case-library" hidden><label for="r-case">등록된 사례 연구</label><select id="r-case"></select><button id="r-open-case" class="r-primary">사례 열기·이어하기</button></section>
<div class="r-nav-label">ADAPTIVE DD WORKFLOW</div><nav id="r-nav" aria-label="실사 5단계"></nav>
<button id="r-deal-map" type="button">거래 구조·FDD 시각화 ↗</button>
<div class="r-left-bottom"><button id="r-example">합성 검증 사례 열기</button><small>{% if hosted %}검토 이력은 이 브라우저에서 24시간 열 수 있습니다. 필요한 결과는 내보내세요.{% else %}파일·검토 이력은 이 PC에 저장됩니다.{% endif %}</small></div></aside>
<main id="r-main" tabindex="-1"><div class="r-heading"><div><small id="r-step-kicker"></small><h1 id="r-title"></h1><p id="r-description"></p></div><div id="r-actions"></div></div>
<div id="r-notice" role="status" aria-live="polite"></div><div id="r-content" tabindex="0"></div></main>
<aside class="r-right" aria-label="근거 상세와 프로젝트 자료"><section class="r-detail"><h2>근거·평가 상세</h2><div id="r-detail" tabindex="0"></div></section>
<section class="r-library"><h2>프로젝트 자료</h2><label class="r-sr" for="r-file-search">파일명 검색</label><input id="r-file-search" placeholder="파일명 검색…"><div id="r-files" tabindex="0"></div></section></aside></div>
<div id="r-busy" role="status" hidden><span></span><strong id="r-busy-label">처리 중…</strong><p>자료를 처리하고 있습니다.</p></div>
<dialog id="r-source-dialog" aria-labelledby="r-source-title"></dialog>
</body></html>
